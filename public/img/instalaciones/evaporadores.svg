</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Tipos de evaporador según cómo trabajan</tspan></text><line x1="400" y1="44" x2="400" y2="440" stroke="#d8d0c2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="200" y="62" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>SECO (expansión seca)</tspan></text><polyline points="20,110 70,110" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="20,110 70,110" fill="none" stroke="#f4a3a0" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><polygon points="77,100.65 88,110 77,119.35" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="99,100.65 88,110 99,119.35" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polyline points="88,110 88,92" fill="none" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="88" y="84" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>VET</tspan></text><polyline points="106,110 140,110 140,130" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="106,110 140,110 140,130" fill="none" stroke="#9ec9f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="140" y1="130" x2="330" y2="130" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="140" y1="130" x2="330" y2="130" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round"/><path d="M330,130 A15.0,15.0 0 0 1 330,160" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,130 A15.0,15.0 0 0 1 330,160" fill="none" stroke="#9ec3ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="160" x2="140" y2="160" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="330" y1="160" x2="140" y2="160" stroke="#9ec3ef" stroke-width="9" stroke-linecap="round"/><path d="M140,160 A15.0,15.0 0 0 0 140,190" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M140,160 A15.0,15.0 0 0 0 140,190" fill="none" stroke="#d9c0e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="140" y1="190" x2="330" y2="190" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="140" y1="190" x2="330" y2="190" stroke="#d9c0e8" stroke-width="9" stroke-linecap="round"/><path d="M330,190 A15.0,15.0 0 0 1 330,220" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,190 A15.0,15.0 0 0 1 330,220" fill="none" stroke="#f2b8b5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="220" x2="140" y2="220" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="330" y1="220" x2="140" y2="220" stroke="#f2b8b5" stroke-width="9" stroke-linecap="round"/><polyline points="140,220 112,220 112,262 340,262" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="140,220 112,220 112,262 340,262" fill="none" stroke="#f2b8b5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="300" y1="262" x2="345" y2="262" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="20" y="142" font-size="13.5" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>entra</tspan><tspan x="20" dy="17">mezcla</tspan><tspan x="20" dy="17">(¼ a ⅓</tspan><tspan x="20" dy="17">líquido)</tspan></text><rect x="98" y="232" width="28" height="18" rx="6" fill="#fde68a" stroke="#1b1d1f" stroke-width="2" /><text x="22" y="246" font-size="13.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>bulbo</tspan></text><text x="228" y="254" font-size="14" text-anchor="middle" font-weight="600" fill="#c62828"><tspan>sale todo VAPOR</tspan></text><text x="200" y="296" font-size="14" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>Se evapora a lo largo del tubo; al final sale vapor</tspan></text><text x="200" y="314" font-size="14" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>algo sobrecalentado. Parte de la pared solo toca vapor.</tspan></text><text x="200" y="336" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Buena circulación pero mucha caída de presión:</tspan></text><text x="200" y="354" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>distribuidores en pasos paralelos + acumulador de aspiración.</tspan></text><text x="600" y="62" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>INUNDADO (expansión húmeda)</tspan></text><g transform="translate(0,26)"><rect x="450" y="96" width="300" height="54" rx="27" fill="#ffffff" stroke="#1b1d1f" stroke-width="3" /><clipPath id="tank"><rect x="450" y="96" width="300" height="54" rx="27"/></clipPath><rect x="450" y="124" width="300" height="26" fill="#9ec9f5" clip-path="url(#tank)"/><line x1="450" y1="124" x2="750" y2="124" stroke="#1565c0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="450" y="96" width="300" height="54" rx="27" fill="none" stroke="#1b1d1f" stroke-width="3" /><text x="600" y="116" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>separador / acumulador</tspan></text><polyline points="412,124 452,124" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="412,124 452,124" fill="none" stroke="#f4a3a0" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><circle cx="490" cy="130" r="7" fill="#fde68a" stroke="#1b1d1f" stroke-width="2"/><text x="420" y="178" font-size="13.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>válvula de</tspan><tspan x="420" dy="17">flotador</tspan></text><polyline points="600,96 600,72 770,72" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="600,96 600,72 770,72" fill="none" stroke="#d9e6f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><text x="690" y="66" font-size="13.5" text-anchor="middle" font-weight="600" fill="#c62828"><tspan>solo VAPOR al compresor</tspan></text><polyline points="500,150 500,190" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="500,150 500,190" fill="none" stroke="#6aa7ea" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="700,190 700,150" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="700,190 700,150" fill="none" stroke="#c9b3f0" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="500" y1="190" x2="700" y2="190" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="500" y1="190" x2="700" y2="190" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round"/><path d="M700,190 A15.0,15.0 0 0 1 700,220" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,190 A15.0,15.0 0 0 1 700,220" fill="none" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="700" y1="220" x2="500" y2="220" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="700" y1="220" x2="500" y2="220" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round"/><path d="M500,220 A15.0,15.0 0 0 0 500,250" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,220 A15.0,15.0 0 0 0 500,250" fill="none" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="500" y1="250" x2="700" y2="250" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="500" y1="250" x2="700" y2="250" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round"/><path d="M700,250 A15.0,15.0 0 0 1 700,280" fill="none" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,250 A15.0,15.0 0 0 1 700,280" fill="none" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="700" y1="280" x2="500" y2="280" stroke="#1b1d1f" stroke-width="13" stroke-linecap="round"/><line x1="700" y1="280" x2="500" y2="280" stroke="#6aa7ea" stroke-width="9" stroke-linecap="round"/><circle cx="712" cy="170" r="3" fill="#fff" stroke="#1b1d1f" stroke-width="1"/><circle cx="690" cy="160" r="3" fill="#fff" stroke="#1b1d1f" stroke-width="1"/><circle cx="716" cy="150" r="3" fill="#fff" stroke="#1b1d1f" stroke-width="1"/><circle cx="700" cy="140" r="3" fill="#fff" stroke="#1b1d1f" stroke-width="1"/><text x="724" y="172" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic"><tspan>sube mezcla</tspan><tspan x="724" dy="16">(líquido +</tspan><tspan x="724" dy="16">burbujas)</tspan></text><text x="480" y="232" font-size="13.5" text-anchor="end" font-weight="400" fill="#1565c0" font-style="italic"><tspan>baja</tspan><tspan x="480" dy="17">líquido</tspan></text></g><text x="600" y="322" font-size="14" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>El serpentín está siempre lleno de líquido: moja toda</tspan></text><text x="600" y="340" font-size="14" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>la superficie y transfiere mejor (estantes de heladeras).</tspan></text><text x="600" y="362" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Variante sobrealimentado: bombas mandan más líquido</tspan></text><text x="600" y="380" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>del que se evapora (relación típica 4 a 1).</tspan></text><line x1="30" y1="400" x2="770" y2="400" stroke="#d8d0c2" stroke-width="1.5" stroke-linecap="round"/><text x="30" y="428" font-size="16" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Según cómo mueven el aire:</tspan></text><text x="30" y="454" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>• Convección natural: el aire circula por diferencia de densidad; bandejas debajo que juntan el agua.</tspan></text><text x="30" y="476" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>• Tiro forzado: serpentín en un gabinete con ventilador, fuera de la cámara (lo moderno).</tspan></text></svg>