</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" font-size="18" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>1) Tendido lineal (abierto o en peine)</tspan></text><rect x="20" y="66" width="90" height="90" rx="6" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2.5" /><text x="65" y="108" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>Compresor</tspan><tspan x="65" dy="18">y pulmón</tspan></text><line x1="110" y1="112" x2="750" y2="132" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/><path d="M250,112.375 L250,86.375 Q250,72.375 264,72.375 Q278,72.375 278,86.375 L278,190" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="256" y="190" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="278" y="209" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C1</tspan></text><path d="M400,117.0625 L400,91.0625 Q400,77.0625 414,77.0625 Q428,77.0625 428,91.0625 L428,190" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="406" y="190" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="428" y="209" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C2</tspan></text><path d="M550,121.75 L550,95.75 Q550,81.75 564,81.75 Q578,81.75 578,95.75 L578,190" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="556" y="190" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="578" y="209" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C3</tspan></text><path d="M690,126.125 L690,100.125 Q690,86.125 704,86.125 Q718,86.125 718,100.125 L718,190" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="696" y="190" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="718" y="209" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C4</tspan></text><line x1="750" y1="136" x2="750" y2="176" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/><polygon points="742,149.2 750,156 742,162.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="758,149.2 750,156 758,162.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="762" y="172" font-size="14" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>purga</tspan></text><line x1="160" y1="97.5625" x2="215" y2="99.28125" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="450" y1="106.625" x2="505" y2="108.34375" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="319" y1="108" x2="331" y2="128" stroke="#c62828" stroke-width="3.2" stroke-linecap="round"/><line x1="331" y1="108" x2="319" y2="128" stroke="#c62828" stroke-width="3.2" stroke-linecap="round"/><text x="325" y="98" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828"><tspan>corte</tspan></text><text x="20" y="244" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>+ Simple y barato (menos caño). Pendiente ≈ 2° en el sentido del aire hacia la purga.</tspan></text><text x="20" y="264" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>− Los consumos del final reciben menos presión; si se corta un tramo, quedan sin aire todos los que siguen.</tspan></text><text x="20" y="312" font-size="18" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>2) Anillo cerrado</tspan></text><rect x="20" y="360" width="90" height="90" rx="6" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2.5" /><text x="65" y="402" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>Compresor</tspan><tspan x="65" dy="18">y pulmón</tspan></text><line x1="110" y1="405" x2="150" y2="405" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/><rect x="150" y="335" width="590" height="140" rx="16" fill="none" stroke="#6b7280" stroke-width="8" /><line x1="300" y1="352" x2="355" y2="352" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="490" y1="352" x2="545" y2="352" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="270" y1="488" x2="330" y2="488" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="570" y1="488" x2="630" y2="488" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><path d="M260,331 L260,305 Q260,291 274,291 Q288,291 288,305 L288,380" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="266" y="380" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="288" y="399" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><path d="M420,331 L420,305 Q420,291 434,291 Q448,291 448,305 L448,380" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="426" y="380" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="448" y="399" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><path d="M580,331 L580,305 Q580,291 594,291 Q608,291 608,305 L608,380" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="586" y="380" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="608" y="399" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><line x1="340" y1="471" x2="340" y2="436" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/><rect x="318" y="408" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="340" y="427" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><line x1="500" y1="471" x2="500" y2="436" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/><rect x="478" y="408" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="500" y="427" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><line x1="660" y1="471" x2="660" y2="436" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/><rect x="638" y="408" width="44" height="28" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="660" y="427" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>C</tspan></text><polygon points="361,327.35 370,335 361,342.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="379,327.35 370,335 379,342.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="521,467.35 530,475 521,482.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="539,467.35 530,475 539,482.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="530" y1="487" x2="530" y2="504" stroke="#1b1d1f" stroke-width="1.2" stroke-linecap="round"/><text x="530" y="520" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>válvulas de seccionamiento</tspan></text><line x1="700" y1="479" x2="700" y2="510" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/><polygon points="692,489.2 700,496 692,502.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="708,489.2 700,496 708,502.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="712" y="512" font-size="14" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>purga</tspan></text><text x="20" y="556" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>+ El aire llega por dos caminos: presión más pareja y se puede aislar un tramo sin dejar a todos sin aire.</tspan></text><text x="20" y="576" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>− Más caño y más costo; es más difícil ubicar dónde se junta el agua.</tspan></text><g transform="translate(0,44)"><text x="20" y="618" font-size="18" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>3) Detalle: tomas por ARRIBA, purgas por ABAJO</tspan></text><rect x="60" y="650" width="460" height="44" rx="0" fill="#f9fafb" stroke="#1b1d1f" stroke-width="3" /><rect x="61.5" y="676" width="457" height="16.5" rx="0" fill="#bbdefb" stroke="none" stroke-width="0" /><path d="M62,676 Q80,671 98,676 T134,676 T170,676 T206,676 T242,676 T278,676 T314,676 T350,676 T386,676 T422,676 T458,676 T494,676 T518,676" fill="none" stroke="#1565c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="668" font-size="14" text-anchor="middle" font-weight="400" fill="#1565c0"><tspan>el condensado (agua) corre por el fondo</tspan></text><line x1="480" y1="636" x2="410" y2="636" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="300" y="630" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>sentido del aire y pendiente</tspan></text><path d="M440,650 L440,618 Q440,602 456,602 L560,602 Q576,602 576,618 L576,744" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="556" y="668" width="40" height="26" rx="4" fill="#fde68a" stroke="#1b1d1f" stroke-width="2" /><text x="576" y="686" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>FRL</tspan></text><rect x="546" y="722" width="60" height="32" rx="4" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2" /><text x="576" y="743" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>Equipo</tspan></text><text x="508" y="570" font-size="15" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Toma de servicio por ARRIBA</tspan></text><text x="508" y="587" font-size="14" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>(cuello de cisne: no se lleva el agua)</tspan></text><line x1="120" y1="694" x2="120" y2="748" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/><polygon points="112,715.2 120,722 112,728.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="128,715.2 120,722 128,728.8" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="120" y1="750" x2="120" y2="768" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><text x="140" y="726" font-size="15" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Bajada de purga por ABAJO</tspan></text><text x="140" y="744" font-size="14" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>(manual o automática)</tspan></text></g></svg>