</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="24" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Ciclos de un circuito frigorífico básico (ejemplo amoníaco)</tspan></text><rect x="100.0" y="66" width="228.0" height="134" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" /><rect x="373.6" y="66" width="364.79999999999995" height="134" rx="0" fill="#fdecea" stroke="none" stroke-width="0" /><text x="214.0" y="84" font-size="13" text-anchor="middle" font-weight="700" fill="#1565c0"><tspan>LADO DE BAJA</tspan></text><text x="556.0" y="84" font-size="13" text-anchor="middle" font-weight="700" fill="#c62828"><tspan>LADO DE ALTA</tspan></text><text x="10" y="58" font-size="16" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Presión (bar)</tspan></text><line x1="100.0" y1="66" x2="100.0" y2="200" stroke="#1b1d1f" stroke-width="2" stroke-linecap="round"/><line x1="100.0" y1="200" x2="746.4" y2="200" stroke="#1b1d1f" stroke-width="2" stroke-linecap="round"/><line x1="96.0" y1="200" x2="100.0" y2="200" stroke="#1b1d1f" stroke-width="1.5" stroke-linecap="round"/><text x="92.0" y="205" font-size="13" text-anchor="end" font-weight="400" fill="#1b1d1f"><tspan>0</tspan></text><line x1="96.0" y1="150" x2="100.0" y2="150" stroke="#1b1d1f" stroke-width="1.5" stroke-linecap="round"/><text x="92.0" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#1b1d1f"><tspan>5</tspan></text><line x1="96.0" y1="100" x2="100.0" y2="100" stroke="#1b1d1f" stroke-width="1.5" stroke-linecap="round"/><text x="92.0" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#1b1d1f"><tspan>10</tspan></text><polyline points="100.0,180 328.0,180 373.6,95.0 738.4,95.0" fill="none" stroke="#1565c0" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="738.4" y1="95.0" x2="738.4" y2="180" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/><text x="206.4" y="172" font-si