<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-label="Ciclos de presión, temperatura y fase de un circuito frigorífico básico (ejemplo amoníaco)" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
