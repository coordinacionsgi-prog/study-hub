<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Accesorios de una caldera acuotubular para mejorar el rendimiento" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Accesorios que aprovechan el calor de los gases</tspan></text><rect x="40" y="150" width="180" height="190" rx="12" fill="#ffffff" stroke="#1b1d1f" stroke-width="3" /><rect x="41.5" y="262" width="177" height="76" rx="0" fill="#cfe5fb" stroke="none" stroke-width="0" /><rect x="70" y="112" width="80" height="40" rx="18" fill="#f1ede4" stroke="#1b1d1f" stroke-width="2.5" /><text x="110" y="137" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>domo</tspan></text><text x="130" y="220" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>caldera</tspan><tspan x="130" dy="18">acuotubular</tspan></text><rect x="100" y="340" width="60" height="28" rx="4" fill="#b9c0c6" stroke="#1b1d1f" stroke-width="2.5" /><text x="130" y="388" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>quemador</tspan></text><path d="M130,262 C108,291.6 108,321.2 130,336 C152,321.2 152,291.6 130,262 Z" fill="#ff9800" stroke="#ef6c00" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,276 C119.0,295.3 119.0,317.5 130,326 C141.0,317.5 141.0,295.3 130,276 Z" fill="#ffe082" stroke="#ffe082" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="190" width="480" height="70" rx="0" fill="#f5f1e8" stroke="#1b1d1f" stroke-width="2.5" /><line x1="228" y1="225" x2="690" y2="225" stroke="#e65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><rect x="698" y="90" width="36" height="170" rx="0" fill="#d7d2c7" stroke="#1b1d1f" stroke-width="2.5" /><line x1="716" y1="235" x2="716" y2="100" stroke="#e65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><text x="716" y="80" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>chimenea</tspan></text><rect x="245" y="200" width="110" height="50" rx="0" fill="#fde8e6" stroke="#1b1d1f" stroke-width="2.5" /><text x="300" y="216" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Sobrecalentador</tspan></text><polyline points="255,226 345,226 345,234 255,234 255,242 345,242" fill="none" stroke="#e57373" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="275" y1="150" x2="275" y2="198" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><text x="268" y="134" font-size="13.5" text-anchor="end" font-weight="600" fill="#c62828"><tspan>vapor</tspan><tspan x="268" dy="17">saturado</tspan></text><line x1="325" y1="198" x2="325" y2="150" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><text x="335" y="134" font-size="13.5" text-anchor="start" font-weight="600" fill="#c62828"><tspan>vapor sobre-</tspan><tspan x="335" dy="17">calentado</tspan></text><rect x="390" y="200" width="110" height="50" rx="0" fill="#e3f0fc" stroke="#1b1d1f" stroke-width="2.5" /><text x="445" y="216" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Economizador</tspan></text><polyline points="400,226 490,226 490,234 400,234 400,242 490,242" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="480" y1="312" x2="480" y2="262" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><text x="490" y="334" font-size="13.5" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>agua de</tspan><tspan x="490" dy="17">alimentación</tspan><tspan x="490" dy="17">(fría)</tspan></text><line x1="410" y1="262" x2="410" y2="312" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><text x="404" y="334" font-size="13.5" text-anchor="end" font-weight="600" fill="#1565c0"><tspan>agua pre-</tspan><tspan x="404" dy="17">calentada</tspan><tspan x="404" dy="17">→ a la caldera</tspan></text><rect x="535" y="200" width="110" height="50" rx="0" fill="#eeeeee" stroke="#1b1d1f" stroke-width="2.5" /><text x="590" y="216" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Precal. de aire</tspan></text><line x1="555" y1="226" x2="555" y2="246" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="575" y1="226" x2="575" y2="246" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="595" y1="226" x2="595" y2="246" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="615" y1="226" x2="615" y2="246" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="555" y1="198" x2="555" y2="150" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><text x="548" y="134" font-size="13.5" text-anchor="end" font-weight="600" fill="#1565c0"><tspan>aire caliente</tspan><tspan x="548" dy="17">→ al quemador</tspan></text><line x1="625" y1="150" x2="625" y2="198" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><text x="635" y="134" font-size="13.5" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>aire frío</tspan></text><text x="40" y="430" font-size="15" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Los tres aprovechan el calor de los gases que, si no, se irían por la chimenea:</tspan></text><text x="40" y="454" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>1) Sobrecalentador: pasa el vapor saturado a vapor sobrecalentado (seco, más temperatura sin más presión).</tspan></text><text x="40" y="474" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>2) Economizador: precalienta el agua de alimentación.   3) Precalentador de aire: calienta el aire de combustión.</tspan></text><text x="40" y="498" font-size="15" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Se suman el tratamiento del agua (ablandamiento, desaireación, purgas) y el retorno de condensado.</tspan></text></svg>