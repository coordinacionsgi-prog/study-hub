<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" aria-label="Tres generaciones de halogenuros: CFC, HCFC y HFC" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Gases refrigerantes halogenados: 3 generaciones</tspan></text><rect x="20" y="60" width="230" height="366" rx="12" fill="#fdecea" stroke="#1b1d1f" stroke-width="2.5" /><text x="135" y="92" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>1ª generación: CFC</tspan></text><text x="135" y="118" font-size="14.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>cloro + flúor + carbono</tspan></text><text x="135" y="140" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>ej. R-12 (1931)</tspan></text><text x="40" y="190" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>ODP (daña el ozono)</tspan></text><rect x="40" y="198" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="40" y="198" width="190" height="16" rx="3" fill="#c62828" stroke="none" stroke-width="0" /><text x="40" y="236" font-size="13.5" text-anchor="start" font-weight="700" fill="#c62828"><tspan>alto</tspan></text><text x="40" y="270" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>GWP (calienta el planeta)</tspan></text><rect x="40" y="278" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="40" y="278" width="170" height="16" rx="3" fill="#e65100" stroke="none" stroke-width="0" /><text x="40" y="316" font-size="13.5" text-anchor="start" font-weight="700" fill="#e65100"><tspan>alto</tspan></text><rect x="40" y="336" width="190" height="30" rx="6" fill="#c62828" stroke="none" stroke-width="0" /><text x="135" y="357" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan>PROHIBIDOS</tspan></text><text x="135" y="384" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>Protocolo de Montreal (1987)</tspan></text><rect x="285" y="60" width="230" height="366" rx="12" fill="#fff3e0" stroke="#1b1d1f" stroke-width="2.5" /><text x="400" y="92" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>2ª generación: HCFC</tspan></text><text x="400" y="118" font-size="14.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>con hidrógeno</tspan></text><text x="400" y="140" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>ej. R-22</tspan></text><text x="305" y="190" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>ODP (daña el ozono)</tspan></text><rect x="305" y="198" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="305" y="198" width="19" height="16" rx="3" fill="#c62828" stroke="none" stroke-width="0" /><text x="305" y="236" font-size="13.5" text-anchor="start" font-weight="700" fill="#c62828"><tspan>bajo (~10 % del CFC)</tspan></text><text x="305" y="270" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>GWP (calienta el planeta)</tspan></text><rect x="305" y="278" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="305" y="278" width="150" height="16" rx="3" fill="#e65100" stroke="none" stroke-width="0" /><text x="305" y="316" font-size="13.5" text-anchor="start" font-weight="700" fill="#e65100"><tspan>alto</tspan></text><rect x="305" y="336" width="190" height="30" rx="6" fill="#e65100" stroke="none" stroke-width="0" /><text x="400" y="357" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan>EN RETIRO</tspan></text><text x="400" y="384" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>sin equipos nuevos desde 2010,</tspan><tspan x="400" dy="16">prohibidos desde 2020</tspan></text><rect x="550" y="60" width="230" height="366" rx="12" fill="#e8f5e9" stroke="#1b1d1f" stroke-width="2.5" /><text x="665" y="92" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>3ª generación: HFC</tspan></text><text x="665" y="118" font-size="14.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>sin cloro</tspan></text><text x="665" y="140" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>ej. R-134a (reemplaza al R-12)</tspan></text><text x="570" y="190" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>ODP (daña el ozono)</tspan></text><rect x="570" y="198" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="570" y="198" width="3" height="16" rx="3" fill="#c62828" stroke="none" stroke-width="0" /><text x="570" y="236" font-size="13.5" text-anchor="start" font-weight="700" fill="#c62828"><tspan>cero</tspan></text><text x="570" y="270" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>GWP (calienta el planeta)</tspan></text><rect x="570" y="278" width="190" height="16" rx="3" fill="#ffffff" stroke="#1b1d1f" stroke-width="1.5" /><rect x="570" y="278" width="170" height="16" rx="3" fill="#e65100" stroke="none" stroke-width="0" /><text x="570" y="316" font-size="13.5" text-anchor="start" font-weight="700" fill="#e65100"><tspan>alto</tspan></text><rect x="570" y="336" width="190" height="30" rx="6" fill="#15803d" stroke="none" stroke-width="0" /><text x="665" y="357" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan>VIGENTES HOY</tspan></text><text x="665" y="384" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>'freones ecológicos', pero</tspan><tspan x="665" dy="16">calientan el planeta</tspan></text><text x="252" y="235" font-size="28" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>→</tspan></text><text x="517" y="235" font-size="28" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>→</tspan></text><text x="40" y="456" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>ODP = potencial de agotamiento del ozono (CFC-11 = 1).</tspan></text><text x="40" y="478" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>GWP = potencial de calentamiento global (CO2 = 1, a 100 años).</tspan></text><text x="40" y="504" font-size="15" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Cada generación arregló el problema de la anterior y dejó otro.</tspan></text><text x="40" y="530" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Fuera de los halogenuros: amoníaco, CO2, agua e hidrocarburos (propano, isobutano): ODP cero y casi no calientan.</tspan></text><text x="40" y="552" font-size="14.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Hay además mezclas, como el R-410.</tspan></text></svg>