<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Fluido intermediario en un circuito frigorífico grande" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Fluido intermediario (agua con glicol o salmuera)</tspan></text><rect x="20" y="60" width="340" height="340" rx="10" fill="#fbf7ee" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="190" y="84" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>SALA DE MÁQUINAS</tspan></text><text x="190" y="102" font-size="13.5" text-anchor="middle" font-weight="400" fill="#c62828" font-style="italic"><tspan>circuito corto del refrigerante (poca carga)</tspan></text><circle cx="80" cy="150" r="24" fill="#fff" stroke="#1b1d1f" stroke-width="2.5"/><polygon points="72,142 72,158 92,150" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="190" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>compresor</tspan></text><rect x="180" y="128" width="100" height="44" rx="0" fill="#fdecea" stroke="#1b1d1f" stroke-width="2.5" /><polyline points="190,140 270,140 270,150 190,150 190,160 270,160" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="230" y="190" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>condensador</tspan></text><line x1="104" y1="150" x2="180" y2="150" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ahr)"/><polyline points="280,150 320,150 320,215" fill="none" stroke="#c62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="311,224.35 320,232 311,239.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="329,224.35 320,232 329,239.65" fill="#fff" stroke="#1b1d1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="334" y="236" font-size="12.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>válvula de</tspan><tspan x="334" dy="16">expansión</tspan></text><polyline points="320,242 320,275 300,275" fill="none" stroke="#1565c0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><rect x="110" y="270" width="190" height="70" rx="8" fill="#e8f1fc" stroke="#1b1d1f" stroke-width="3" /><text x="205" y="262" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>intercambiador de casco y tubos</tspan></text><text x="205" y="358" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1565c0" font-style="italic"><tspan>el refrigerante se evapora del lado del casco</tspan></text><line x1="116" y1="305" x2="294" y2="305" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round"/><line x1="116" y1="318" x2="294" y2="318" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round"/><line x1="116" y1="331" x2="294" y2="331" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round"/><polyline points="110,305 42,305 42,172 62,156" fill="none" stroke="#1565c0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><text x="570" y="78" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>CIRCUITO LARGO (por todas las cámaras)</tspan></text><text x="570" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#1565c0" font-style="italic"><tspan>fluido barato e inofensivo</tspan></text><polyline points="300,336 400,336 400,150" fill="none" stroke="#9ec9f5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,336 400,336 400,150" fill="none" stroke="#1b1d1f" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="470" y="100" width="200" height="60" rx="6" fill="#eef5fc" stroke="#1b1d1f" stroke-width="2.5" /><polyline points="485,120 655,120 655,136 485,136" fill="none" stroke="#6aa7ea" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="154" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>cámara 1</tspan></text><line x1="400" y1="130" x2="470" y2="130" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="670" y1="130" x2="720" y2="130" stroke="#e57373" stroke-width="4" stroke-linecap="round"/><rect x="470" y="190" width="200" height="60" rx="6" fill="#eef5fc" stroke="#1b1d1f" stroke-width="2.5" /><polyline points="485,210 655,210 655,226 485,226" fill="none" stroke="#6aa7ea" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="244" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>cámara 2</tspan></text><line x1="400" y1="220" x2="470" y2="220" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="670" y1="220" x2="720" y2="220" stroke="#e57373" stroke-width="4" stroke-linecap="round"/><rect x="470" y="280" width="200" height="60" rx="6" fill="#eef5fc" stroke="#1b1d1f" stroke-width="2.5" /><polyline points="485,300 655,300 655,316 485,316" fill="none" stroke="#6aa7ea" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="334" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>cámara 3</tspan></text><line x1="400" y1="310" x2="470" y2="310" stroke="#6aa7ea" stroke-width="4" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="670" y1="310" x2="720" y2="310" stroke="#e57373" stroke-width="4" stroke-linecap="round"/><line x1="720" y1="130" x2="720" y2="420" stroke="#e57373" stroke-width="4" stroke-linecap="round"/><polyline points="720,420 340,420 340,350" fill="none" stroke="#e57373" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><circle cx="560" cy="420" r="18" fill="#fff" stroke="#1b1d1f" stroke-width="2.5"/><polygon points="553,412 553,428 569,420" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="456" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>bomba</tspan></text><text x="40" y="490" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Se llena de refrigerante solo el circuito corto (menos carga, menos costo, menos riesgo si hay fuga).</tspan></text><text x="40" y="512" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Antes se usaba salmuera (agua con sal); hoy agua con 20-35 % de glicol, líquida a -15 o -20 °C.</tspan></text><text x="40" y="534" font-size="14.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Costo: un salto de temperatura extra en el intercambiador.</tspan></text></svg>