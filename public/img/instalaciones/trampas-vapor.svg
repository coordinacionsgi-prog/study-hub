<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="Trampas de vapor: mecánica, termostática y termodinámica" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Trampa de vapor: deja salir condensado y aire, no deja escapar vapor</tspan></text><text x="135" y="62" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>MECÁNICA (flotador)</tspan></text><clipPath id="tf"><circle cx="135" cy="190" r="72"/></clipPath><circle cx="135" cy="190" r="72" fill="#ffffff" stroke="#1b1d1f" stroke-width="3"/><rect x="63" y="205" width="144" height="60" fill="#cfe5fb" clip-path="url(#tf)"/><line x1="63" y1="205" x2="207" y2="205" stroke="#1565c0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="135" cy="190" r="72" fill="none" stroke="#1b1d1f" stroke-width="3"/><polyline points="10,150 65,150" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="10,150 65,150" fill="none" stroke="#d9e6f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="12" y1="150" x2="60" y2="150" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="10" y="112" font-size="13" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>entra vapor +</tspan><tspan x="10" dy="16">condensado</tspan></text><circle cx="110" cy="210" r="20" fill="#fde68a" stroke="#1b1d1f" stroke-width="2.5"/><line x1="125" y1="200" x2="172" y2="244" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round"/><circle cx="172" cy="244" r="3" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><polygon points="176,252 190,252 183,262" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="183,262 183,305 245,305" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="183,262 183,305 245,305" fill="none" stroke="#cfe5fb" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="210" y1="305" x2="245" y2="305" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="245" y="326" font-size="13" text-anchor="end" font-weight="600" fill="#1b1d1f"><tspan>sale solo</tspan><tspan x="245" dy="16">condensado</tspan></text><text x="135" y="112" font-size="13" text-anchor="middle" font-weight="600" fill="#6b7280"><tspan>vapor</tspan></text><text x="135" y="380" font-size="15" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Funciona por DENSIDAD</tspan></text><text x="135" y="400" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>el flotador (Arquímedes) sube</tspan><tspan x="135" dy="17">con el condensado y abre la</tspan><tspan x="135" dy="17">salida; con vapor queda cerrada</tspan></text><text x="400" y="62" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>TERMOSTÁTICA (fuelle)</tspan></text><rect x="315" y="120" width="170" height="150" rx="20" fill="#ffffff" stroke="#1b1d1f" stroke-width="3" /><rect x="365" y="145" width="70" height="50" rx="6" fill="#fde8e6" stroke="#1b1d1f" stroke-width="2.5" /><line x1="375" y1="148" x2="375" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><line x1="385" y1="148" x2="385" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><line x1="395" y1="148" x2="395" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><line x1="405" y1="148" x2="405" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><line x1="415" y1="148" x2="415" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><line x1="425" y1="148" x2="425" y2="192" stroke="#c98a86" stroke-width="1.5" stroke-linecap="round"/><text x="400" y="168" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>fuelle</tspan></text><line x1="400" y1="195" x2="400" y2="222" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round"/><polygon points="392,222 408,222 400,238" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="387" y="240" width="26" height="8" rx="0" fill="#d1d5db" stroke="#1b1d1f" stroke-width="2" /><polyline points="400,248 400,305 520,305" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="400,248 400,305 520,305" fill="none" stroke="#cfe5fb" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="435" y1="305" x2="520" y2="305" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><polyline points="285,230 317,230" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="285,230 317,230" fill="none" stroke="#d9e6f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="287" y1="230" x2="315" y2="230" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="285" y="214" font-size="13" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>entra</tspan></text><text x="520" y="326" font-size="13" text-anchor="end" font-weight="600" fill="#1b1d1f"><tspan>sale solo</tspan><tspan x="520" dy="16">condensado</tspan></text><text x="400" y="380" font-size="15" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Funciona por TEMPERATURA</tspan></text><text x="400" y="400" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>el condensado está más frío que</tspan><tspan x="400" dy="17">el vapor: el fuelle se contrae y</tspan><tspan x="400" dy="17">abre; con vapor se dilata y cierra</tspan></text><text x="665" y="62" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>TERMODINÁMICA (disco)</tspan></text><rect x="585" y="150" width="160" height="120" rx="14" fill="#ffffff" stroke="#1b1d1f" stroke-width="3" /><rect x="620" y="170" width="90" height="8" rx="2" fill="#9ca3af" stroke="#1b1d1f" stroke-width="2" /><text x="665" y="163" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>disco</tspan></text><rect x="620" y="236" width="25" height="8" rx="0" fill="#d1d5db" stroke="#1b1d1f" stroke-width="2" /><rect x="685" y="236" width="25" height="8" rx="0" fill="#d1d5db" stroke="#1b1d1f" stroke-width="2" /><polyline points="550,250 587,250" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="550,250 587,250" fill="none" stroke="#d9e6f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="552" y1="250" x2="585" y2="250" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="550" y="234" font-size="13" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>entra</tspan></text><polyline points="743,250 785,250" fill="none" stroke="#1b1d1f" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="743,250 785,250" fill="none" stroke="#cfe5fb" stroke-width="8" stroke-linejoin="round" stroke-linecap="butt"/><line x1="745" y1="250" x2="785" y2="250" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="785" y="276" font-size="13" text-anchor="end" font-weight="600" fill="#1b1d1f"><tspan>sale</tspan></text><line x1="665" y1="200" x2="665" y2="228" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><text x="665" y="380" font-size="15" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Funciona por el flujo DINÁMICO</tspan></text><text x="665" y="400" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>el vapor flash cierra el disco;</tspan><tspan x="665" dy="17">el condensado lo levanta</tspan><tspan x="665" dy="17">y sale</tspan></text><line x1="30" y1="480" x2="770" y2="480" stroke="#d8d0c2" stroke-width="1.5" stroke-linecap="round"/><text x="30" y="506" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>También eliminan el aire y los gases no condensables (ocupan lugar y no aportan calor) y minimizan la pérdida de vapor.</tspan></text></svg>