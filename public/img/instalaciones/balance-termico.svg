<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-label="Balance térmico de una cámara frigorífica" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Balance térmico de una cámara (calores que entran)</tspan></text><rect x="260" y="150" width="280" height="200" rx="0" fill="#eaf3fb" stroke="#1b1d1f" stroke-width="3.5" /><rect x="536" y="280" width="8" height="70" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="400" y="180" font-size="14" text-anchor="middle" font-weight="700" fill="#1565c0"><tspan>CÁMARA</tspan></text><rect x="285" y="290" width="38" height="40" rx="0" fill="#fde68a" stroke="#1b1d1f" stroke-width="2" /><rect x="329" y="290" width="38" height="40" rx="0" fill="#fde68a" stroke="#1b1d1f" stroke-width="2" /><rect x="373" y="290" width="38" height="40" rx="0" fill="#fde68a" stroke="#1b1d1f" stroke-width="2" /><text x="335" y="345" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>producto</tspan></text><line x1="480" y1="150" x2="480" y2="168" stroke="#1b1d1f" stroke-width="2" stroke-linecap="round"/><circle cx="480" cy="176" r="8" fill="#fff7c2" stroke="#1b1d1f" stroke-width="2"/><circle cx="300" cy="215" r="14" fill="#fff" stroke="#1b1d1f" stroke-width="2.5"/><text x="300" y="220" font-size="14" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>M</tspan></text><circle cx="470" cy="270" r="7" fill="#fff" stroke="#1b1d1f" stroke-width="2"/><line x1="470" y1="277" x2="470" y2="305" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round"/><line x1="470" y1="285" x2="458" y2="297" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round"/><line x1="470" y1="285" x2="482" y2="297" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round"/><line x1="470" y1="305" x2="461" y2="325" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round"/><line x1="470" y1="305" x2="479" y2="325" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round"/><line x1="320" y1="118" x2="320" y2="148" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="320" y1="382" x2="320" y2="352" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="400" y1="118" x2="400" y2="148" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="400" y1="382" x2="400" y2="352" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="480" y1="118" x2="480" y2="148" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="480" y1="382" x2="480" y2="352" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="222" y1="190" x2="258" y2="190" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="222" y1="240" x2="258" y2="240" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><text x="400" y="108" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828"><tspan>Q1: transmisión por paredes, techo y piso</tspan></text><line x1="610" y1="315" x2="548" y2="315" stroke="#c62828" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahr)"/><text x="552" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic"><tspan>puerta</tspan></text><text x="625" y="312" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>Q2: aire que entra</tspan><tspan x="625" dy="18">(puertas, renovación)</tspan></text><line x1="335" y1="290" x2="190" y2="380" stroke="#1b1d1f" stroke-width="1.2" stroke-linecap="round"/><text x="20" y="380" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>Q3: producto</tspan><tspan x="20" dy="18">(enfriar, congelar,</tspan><tspan x="20" dy="18">calor vital)</tspan></text><text x="20" y="280" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>Q4: motores</tspan><tspan x="20" dy="18">(ventiladores, autoelev.)</tspan></text><line x1="286" y1="218" x2="200" y2="290" stroke="#1b1d1f" stroke-width="1.2" stroke-linecap="round"/><line x1="480" y1="184" x2="600" y2="184" stroke="#1b1d1f" stroke-width="1.2" stroke-linecap="round"/><text x="606" y="180" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>Q5: iluminación</tspan></text><line x1="482" y1="280" x2="600" y2="250" stroke="#1b1d1f" stroke-width="1.2" stroke-linecap="round"/><text x="606" y="246" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>Q6: personas</tspan></text><line x1="30" y1="420" x2="770" y2="420" stroke="#d8d0c2" stroke-width="1.5" stroke-linecap="round"/><text x="30" y="446" font-size="15" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Se calculan para 24 horas:</tspan></text><text x="30" y="470" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Q1 = A · K · Δt / x (transmisión)   |   Q2 = n · V · r (recambios de aire por hora)</tspan></text><text x="30" y="492" font-size="14.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Q5 = 4,6 a 9,3 kcal/h por m² de piso   |   Q6 = 100 a 350 kcal/h por persona</tspan></text><text x="30" y="522" font-size="16" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Qt = Q1 + Q2 + Q3 + Q4 + Q5 + Q6</tspan></text><text x="30" y="548" font-size="15" text-anchor="start" font-weight="700" fill="#1565c0"><tspan>El equipo no trabaja las 24 h sino 16 a 20 h por día, así que se agranda: Qc = Qt · 24 / f</tspan></text></svg>