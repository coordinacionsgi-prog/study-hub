</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Condición de red vs. condición FAD (aire libre)</tspan></text><text x="100" y="80" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828"><tspan>CONDICIÓN DE RED</tspan></text><text x="100" y="100" font-size="15" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>1 m³ a 6 bar</tspan></text><rect x="60" y="120" width="80" height="100" rx="0" fill="#fdecea" stroke="#1b1d1f" stroke-width="3" /><rect x="140" y="118" width="8" height="104" rx="0" fill="#9ca3af" stroke="#1b1d1f" stroke-width="2" /><line x1="148" y1="170" x2="164" y2="170" stroke="#1b1d1f" stroke-width="5" stroke-linecap="round"/><circle cx="69" cy="130" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="104" cy="130" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="67" cy="144" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="106" cy="144" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="73" cy="158" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="102" cy="158" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="67" cy="172" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="101" cy="172" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="66" cy="186" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="106" cy="186" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="74" cy="200" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="104" cy="200" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="66" cy="214" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="103" cy="214" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><text x="500" y="80" font-size="15" text-anchor="middle" font-weight="700" fill="#1565c0"><tspan>CONDICIÓN FAD (aire libre, presión atmosférica)</tspan></text><text x="500" y="100" font-size="15" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>6 m³ a 1 bar</tspan></text><rect x="260" y="120" width="480" height="100" rx="0" fill="#e8f1fc" stroke="#1b1d1f" stroke-width="3" /><rect x="740" y="118" width="8" height="104" rx="0" fill="#9ca3af" stroke="#1b1d1f" stroke-width="2" /><line x1="748" y1="170" x2="770" y2="170" stroke="#1b1d1f" stroke-width="5" stroke-linecap="round"/><circle cx="538" cy="196" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="456" cy="163" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="671" cy="150" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="695" cy="141" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="406" cy="155" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="285" cy="210" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="685" cy="161" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="681" cy="162" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="371" cy="149" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="430" cy="165" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="593" cy="175" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="316" cy="205" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="444" cy="177" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><circle cx="531" cy="159" r="3.2" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1"/><text x="200" y="176" font-size="40" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>=</tspan></text><text x="200" y="200" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>misma</tspan><tspan x="200" dy="16">masa de aire</tspan></text><rect x="60" y="270" width="680" height="150" rx="10" fill="#f5f1e8" stroke="#1b1d1f" stroke-width="2" /><text x="400" y="304" font-size="20" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>p1 · Q1 = p2 · Q2        →        Q2 = Q1 · (p1 / p2)</tspan></text><text x="400" y="336" font-size="16" text-anchor="middle" font-weight="400" fill="#1b1d1f"><tspan>Ejemplo: 6 bar · 1 m³/min = 1 bar · Q_FAD   →   Q_FAD = 6 m³/min</tspan></text><text x="400" y="366" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>(gases ideales a temperatura constante; a fines industriales 1 atm ≈ 1 bar)</tspan></text><text x="400" y="398" font-size="15" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>El aire es compresible: hay que llevar todos los caudales a la misma condición antes de sumarlos.</tspan></text></svg>