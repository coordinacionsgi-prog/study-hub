<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" role="img" aria-label="Válvula de expansión termostática (VET) y su autorregulación" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d1f"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3e9dc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a58c" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Válvula de expansión termostática (VET)</tspan></text><polyline points="30,380 110,380" fill="none" stroke="#1b1d1f" stroke-width="14" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="30,380 110,380" fill="none" stroke="#f4a3a0" stroke-width="10" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="230,380 300,380 300,400 590,400" fill="none" stroke="#1b1d1f" stroke-width="14" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="230,380 300,380 300,400 590,400" fill="none" stroke="#9ec9f5" stroke-width="10" stroke-linejoin="round" stroke-linecap="butt"/><path d="M590,400 A12.5,12.5 0 0 0 590,375 L390,375 A12.5,12.5 0 0 1 390,350 L640,350" fill="none" stroke="#1b1d1f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M590,400 A12.5,12.5 0 0 0 590,375 L390,375 A12.5,12.5 0 0 1 390,350 L640,350" fill="none" stroke="#bfdcf7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline points="640,350 665,350 665,250 320,250" fill="none" stroke="#1b1d1f" stroke-width="14" stroke-linejoin="round" stroke-linecap="butt"/><polyline points="640,350 665,350 665,250 320,250" fill="none" stroke="#d9e6f5" stroke-width="10" stroke-linejoin="round" stroke-linecap="butt"/><line x1="335" y1="250" x2="305" y2="250" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="380" y="332" width="230" height="86" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><text x="495" y="438" font-size="17" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Evaporador</tspan></text><rect x="110" y="330" width="120" height="70" rx="0" fill="#e9dfce" stroke="#1b1d1f" stroke-width="3" /><rect x="167" y="357" width="6" height="43" rx="0" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="1" /><line x1="140" y1="392" x2="140" y2="350" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="200" y1="350" x2="200" y2="392" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahb)"/><rect x="110" y="272" width="120" height="52" rx="0" fill="#f3efe6" stroke="#1b1d1f" stroke-width="3" /><rect x="152" y="324" width="36" height="8" rx="0" fill="#e9dfce" stroke="#1b1d1f" stroke-width="2" /><path d="M110,272 A60,60 0 0 1 230,272 Z" fill="#fdecea" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,272 Q140,262 170,272 T230,272" fill="none" stroke="#1b1d1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="170,324 156,318 184,311 156,304 184,297 156,290 170,284" fill="none" stroke="#1b1d1f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="170" y1="272" x2="170" y2="340" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round"/><polygon points="162,338 178,338 170,353" fill="#1b1d1f" stroke="#1b1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="140" y1="228" x2="140" y2="264" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><line x1="128" y1="318" x2="128" y2="280" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><line x1="212" y1="318" x2="212" y2="280" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><rect x="470" y="230" width="52" height="20" rx="8" fill="#fde68a" stroke="#1b1d1f" stroke-width="2.5" /><line x1="466" y1="232" x2="466" y2="252" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round"/><line x1="526" y1="232" x2="526" y2="252" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round"/><path d="M478,230 C440,150 260,130 170,212" fill="none" stroke="#1b1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="420,250 420,312 232,312" fill="none" stroke="#1b1d1f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="10" y="232" font-size="14" text-anchor="start" font-weight="700" fill="#c62828"><tspan>P bulbo</tspan><tspan x="10" dy="18">↓ ABRE</tspan></text><text x="10" y="300" font-size="14" text-anchor="start" font-weight="700" fill="#1565c0"><tspan>P resorte +</tspan><tspan x="10" dy="18">P evaporador</tspan><tspan x="10" dy="18">↑ CIERRAN</tspan></text><text x="532" y="216" font-size="14.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>Bulbo sensor</tspan></text><text x="532" y="232" font-size="13.5" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>(abrazado a la salida)</tspan></text><text x="300" y="118" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>Tubo capilar</tspan></text><text x="242" y="266" font-size="14.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>Diafragma</tspan></text><text x="242" y="292" font-size="14.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>Resorte de regulación</tspan></text><text x="326" y="330" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic"><tspan>Ecualizador externo</tspan></text><text x="240" y="350" font-size="14" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>Aguja y asiento</tspan></text><text x="20" y="412" font-size="14.5" text-anchor="start" font-weight="600" fill="#c62828"><tspan>Entra líquido</tspan><tspan x="20" dy="18">a ALTA presión</tspan></text><text x="240" y="436" font-size="14.5" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>Sale mezcla a BAJA presión</tspan><tspan x="240" dy="18">(líquido + vapor flash)</tspan></text><text x="440" y="274" font-size="14.5" text-anchor="start" font-weight="600" fill="#1b1d1f"><tspan>Sale vapor sobrecalentado</tspan><tspan x="440" dy="18">(5–6 °C) → al compresor</tspan></text><line x1="30" y1="478" x2="770" y2="478" stroke="#d8d0c2" stroke-width="1.5" stroke-linecap="round"/><text x="30" y="504" font-size="17" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Cómo se autorregula</tspan></text><text x="30" y="530" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Sube la carga térmica → el refrigerante se evapora antes → sube el sobrecalentamiento → se calienta el bulbo</tspan></text><text x="30" y="550" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>→ sube P bulbo → el diafragma baja → la válvula ABRE → entra más refrigerante.</tspan></text><text x="30" y="576" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Baja la carga térmica → pasa al revés → la válvula CIERRA.</tspan></text><text x="30" y="606" font-size="16" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Equilibrio del diafragma:  P bulbo = P resorte + P evaporador</tspan></text><text x="30" y="634" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Resultado: mantiene constante el sobrecalentamiento (≈ 5–6 °C) y aprovecha cerca del 95 % del evaporador.</tspan></text><text x="30" y="658" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>Con evaporadores grandes se usa ecualizador externo (toma la presión al final del evaporador).</tspan></text></svg>