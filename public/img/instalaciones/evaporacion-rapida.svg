b1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M525,364 L525,378 L470,378 L470,364" fill="none" stroke="#1b1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="130" x2="262" y2="130" stroke="#1565c0" stroke-width="3" stroke-linecap="round" marker-end="url(#ahb)"/><text x="20" y="112" font-size="14" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>entra agua</tspan><tspan x="20" dy="18">(zona más fría)</tspan></text><line x1="470" y1="120" x2="470" y2="78" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="470" y1="78" x2="610" y2="78" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ahr)"/><text x="618" y="74" font-size="14" text-anchor="start" font-weight="600" fill="#c62828"><tspan>sale vapor o</tspan><tspan x="618" dy="18">agua caliente</tspan></text><line x1="400" y1="160" x2="400" y2="300" stroke="#e65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><line x1="302" y1="330" x2="302" y2="112" stroke="#e65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><path d="M302,112 L302,70 L210,70" fill="none" stroke="#e65100" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aho)"/><text x="200" y="62" font-size="14" text-anchor="end" font-weight="600" fill="#e65100"><tspan>gases a la</tspan><tspan x="200" dy="18">chimenea</tspan></text><line x1="497" y1="330" x2="497" y2="125" stroke="#e65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><line x1="565" y1="420" x2="565" y2="112" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahb)"/><text x="575" y="300" font-size="13.5" text-anchor="start" font-weight="600" fill="#1565c0"><tspan>aire de combustión</tspan><tspan x="575" dy="17">sube por afuera</tspan><tspan x="575" dy="17">(se precalienta)</tspan></text><text x="20" y="440" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>El agua entra por arriba del serpentín exterior (zona más fría), baja, pasa al interior y sale por arriba del</tspan></text><text x="20" y="460" font-size="15" text-anchor="start" font-weight="400" fill="#1b1d1f"><tspan>serpentín interior (la zona más caliente, junto a la llama): UNA sola pasada, como un calefón.</tspan></text><text x="20" y="490" font-size="15" text-anchor="start" font-weight="700" fill="#1b1d1f"><tspan>Como guarda muy poca agua llega a régimen en 4 a 10 minutos (una humotubular tarda horas).</tspan></text></svg>