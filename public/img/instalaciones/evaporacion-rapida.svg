</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="18" text-anchor="middle" font-weight="700" fill="#1b1d1f"><tspan>Caldera de evaporación rápida (doble serpentín helicoidal)</tspan></text><rect x="250" y="100" width="300" height="300" rx="10" fill="#faf8f3" stroke="#1b1d1f" stroke-width="3" /><rect x="355" y="50" width="90" height="50" rx="4" fill="#b9c0c6" stroke="#1b1d1f" stroke-width="2.5" /><text x="400" y="80" font-size="14" text-anchor="middle" font-weight="600" fill="#1b1d1f"><tspan>quemador</tspan></text><path d="M400,102 C364,183.2 364,264.4 400,305 C436,264.4 436,183.2 400,102 Z" fill="#ff9800" stroke="#ef6c00" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M400,116 C382.0,193.35000000000002 382.0,254.25 400,295 C418.0,254.25 418.0,193.35000000000002 400,116 Z" fill="#ffe082" stroke="#ffe082" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="275" cy="130" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="158" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="186" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="214" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="242" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="270" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="298" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="326" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="275" cy="354" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="525" cy="130" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="525" cy="158" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="525" cy="186" r="10" fill="#9ec9f5" stroke="#1b1d1f" stroke-width="2"/><circle cx="525" cy="214" r="10" fill="#9ec9f5" stroke="#1b1